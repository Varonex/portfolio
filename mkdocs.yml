# Configuration de mkdocs pour la génération de pages.
site_name: Portfolio
site_url: https://Varonex.github.io/portfolio/
site_description: My personal portfolio, my projects and ambitions !
site_author: Varonex

theme:
    name: material
    language: en
    copyright: "Varonex's Portfolio &copy; 2026 by Varonex is licensed under CC BY-NC-ND 4.0. To view a copy of this license, visit https://creativecommons.org/licenses/by-nc-nd/4.0/"

    # Couleurs.
    palette:
        # Thème clair.
        - media: "(prefer-color-scheme: light)"
          scheme: default
          primary: cyan
          accent: cyan
          toggle:
              icon: material/brightness-7
              name: Switch to dark theme

        - media: "(prefer-color-scheme: dark)"
          scheme: slate
          primary: cyan
          accent: cyan
          toggle:
              icon: material/brightness-4
              name: Switch to light theme

    # Contenu du site.
    features:
        # Navigation avancée.
        - navigation.indexes
        - navigation.top
        - navigation.instant
        - navigation.tracking
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.sections
        - navigation.expand
        - navigation.path

        # Amélioration sommaire.
        - toc.integrate
        - toc.follow

        # Blocs de code.
        - content.code.copy
        - content.code.select
        - content.code.annotate

        # Barre de recherche.
        - search.suggest
        - search.highlight
        - search.share

# Liaison CSS.
extra_css:
    - css/style.css

# Liaison JS.
extra_javascript:
    - js/app.js

# Enlève les marques du générateur.
extra:
    generator: false

nav:
    - Home: home.md
