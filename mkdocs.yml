# Configuration de mkdocs pour la génération de pages.
site_name: Portfolio
site_url: https://Varonex.github.io/portfolio/
site_description: My personal portfolio, my projects and ambitions !
site_author: Varonex

theme:
    name: material
    language: en

    # Couleurs.
    palette:
        scheme: slate
        primary: cyan
        accent: cyan

    # Contenu du site.
    features:
        - navigation.top
        - content.code.copy

# Liaison CSS.
extra_css:
    - css/style.css

# Liaison JS.
extra_javascript:
    - js/app.js

# Enlève les marques du générateur.
extra:
    generator: false

nav:
    - Home: index.md
